name: nvr-monitor
services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8095}:8080"
    environment:
      TZ: Europe/Sofia
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - ./data:/data
      - ./recordings:/recordings
      - ./cache:/cache
      - ./updates:/updates
    stop_grace_period: 180s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
