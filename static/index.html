      <label><span data-t="confirmPassword"></span><input name="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password"></label>

    <p id="recoveryEmailStatus" role="status"></p>
    <label><span data-t="recoveryEmail"></span><input name="email" type="email" maxlength="254" autocomplete="email"></label>
    <label><span data-t="oldPassword"></span><input name="password" type="password" required autocomplete="current-password"></label>

      <button id="verifyRecoveryEmail" value="verify_email" data-t="sendVerification"></button>
      <button id="removeRecoveryEmail" value="remove_email" data-t="removeEmail"></button>
    </div>
    <p id="recoveryKeyStatus"></p>
    <div class="toolbar">
      <button value="create_key" data-t="generateRecoveryKey"></button>
      <button id="removeRecoveryKey" value="remove_key" data-t="removeKey"></button>
    </div>
    <label id="generatedKeyLabel" hidden><span data-t="saveRecoveryKey"></span><input id="generatedKey" readonly autocomplete="off"></label>
    <p id="recoveryStatus" role="status"></p>
    <footer><button id="closeRecovery" type="button" data-t="close"></button></footer>

</dialog>

<dialog id="smtpDialog">
  <form id="smtpForm">
    <h2 data-t="smtpSettings"></h2>
    <label class="check"><input name="enabled" type="checkbox"><span data-t="enableEmailRecovery"></span></label>
    <fieldset id="smtpFields">
      <button id="gmailPreset" type="button" data-t="gmailPreset"></button>
      <p class="muted" data-t="gmailHelp"></p>
      <label><span data-t="smtpHost"></span><input name="host" required maxlength="253" placeholder="smtp.gmail.com"></label>
      <label><span data-t="smtpPort"></span><input name="port" type="number" required min="1" max="65535"></label>
      <label><span data-t="smtpSecurity"></span><select name="security"><option value="starttls">STARTTLS</option><option value="tls">TLS</option></select></label>
      <label><span data-t="username"></span><input name="username" maxlength="254" autocomplete="off"></label>
      <label><span data-t="smtpPassword"></span><input name="password" type="password" maxlength="1024" autocomplete="new-password"></label>
      <label><span data-t="smtpSender"></span><input name="sender" type="email" required maxlength="254"></label>
      <label><span data-t="publicUrl"></span><input name="base_url" type="url" required placeholder="https://monitor.example.com"></label>
    </fieldset>
    <button class="primary" data-t="save"></button>
  </form>
  <form id="smtpTestForm">
    <label><span data-t="testRecipient"></span><input name="recipient" type="email" maxlength="254" required></label>
    <button id="sendTestMail" data-t="sendTestEmail"></button>
  </form>
  <p id="smtpStatus" role="status"></p>
  <footer><button id="closeSMTP" type="button" data-t="close"></button></footer>
</dialog>
